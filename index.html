<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NC Behavioral Health Crisis Resources</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>North Carolina Behavioral Health Crisis Resources</h1>

        <p>
            Find Mobile Crisis Teams and alternative 911 behavioral
            health response programs serving your county.
        </p>
    </header>

    <main>

        <section class="search-section">

            <label for="countySelect">
                Select your North Carolina county:
            </label>

            <select id="countySelect">
                <option value="">Choose a county...</option>
            </select>

        </section>

        <div id="results"></div>

    </main>

    <footer>
        <p>
            If there is an immediate life-threatening emergency,
            call 911.
        </p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
