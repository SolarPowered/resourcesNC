<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Resources</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Community Resources</h1>

        <p class="subtitle">

                Search

        </div>

        <div id="results"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
